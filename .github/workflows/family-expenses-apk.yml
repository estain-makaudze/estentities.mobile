# Builds the family_expenses Android APK on GitHub (no EAS queue).
#
# Run: GitHub → Actions → "Family Expenses APK" → Run workflow
#      (also runs automatically on pushes to main that touch family_expenses/).
# Result: the signed APK is attached to the run as an artifact.
#
# Signing: to produce updates that install over the EAS-built app, add these
# repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64      base64 of the EAS keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key (fine for testing,
# but phones with the EAS build must uninstall it first).
name: Family Expenses APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "family_expenses/**"
      - "!family_expenses/server/**"
      - ".github/workflows/family-expenses-apk.yml"

concurrency:
  group: family-expenses-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: family_expenses
    env:
      EXPO_PUBLIC_API_URL: https://estentities.org/family-api
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: family_expenses/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Guard — React Compiler must stay off
        # The data hooks re-run SQLite queries on a `version` counter; the compiler
        # drops that dependency and screens stop refreshing after add/edit/delete.
        run: node -e "if (require('./app.json').expo.experiments?.reactCompiler) { console.error('reactCompiler must be false (see AGENTS.md)'); process.exit(1) }"

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Set version code
        # Monotonic per run, above anything EAS has issued so updates install over older builds.
        run: sed -i -E "s/versionCode [0-9]+/versionCode $((1000 + GITHUB_RUN_NUMBER))/" android/app/build.gradle

      - name: Build release APK
        working-directory: family_expenses/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          IN=android/app/build/outputs/apk/release/app-release.apk
          OUT=family-expenses-${GITHUB_RUN_NUMBER}.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "$OUT" "$IN"
            rm -f "$RUNNER_TEMP/release.jks"
            echo "Signed with the EAS release key" >> "$GITHUB_STEP_SUMMARY"
          else
            cp "$IN" "$OUT"   # already signed with the debug key by Gradle
            echo "⚠️ Signed with a debug key (no ANDROID_KEYSTORE_* secrets set)" >> "$GITHUB_STEP_SUMMARY"
          fi
          "$APKSIGNER" verify --print-certs "$OUT" | head -3
          echo "APK_PATH=family_expenses/$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: family-expenses-apk-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          retention-days: 30
